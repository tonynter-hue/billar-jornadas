<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campeonato de Billar</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1e24">
  <link rel="icon" type="image/png" href="logo-512-jornadas.png">
</head>
<body>

  <!-- Cabecera de la App -->
  <header class="cabecera">
    <div class="cabecera-top">
      <h1 id="titulo-jornada">JORNADA 8</h1>
      <button class="btn-candado" onclick="solicitarPinAdmin()" title="Administrar Jornada">⚙️</button>
    </div>
    <div class="fechas-jornada" id="fechas-jornada">(04/11 al 13/11 de 2026)</div>
    <div class="subtitulo">Pulsa en cada partido para fijar fecha o apuntarte de juez</div>
    <button class="btn btn-pdf no-print" onclick="descargarPDF()">📄 Guardar Jornada en PDF</button>
  </header>

  <!-- Lista de Partidos -->
  <main id="lista-partidos" class="contenedor-partidos"></main>

  <!-- Modal para elegir Juez o Auxiliar -->
  <div id="modal-juez" class="modal oculto no-print">
    <div class="modal-contenido">
      <h3 id="modal-juez-titulo">Elegir Juez</h3>
      <div id="lista-socios" class="lista-botones-socios"></div>
      <button class="btn btn-cerrar" onclick="cerrarModales()">Cancelar</button>
    </div>
  </div>

  <!-- Modal para elegir Día y Hora -->
  <div id="modal-fecha" class="modal oculto no-print">
    <div class="modal-contenido">
      <h3>Fijar fecha del partido</h3>
      <label class="etiqueta">Día:</label>
      <input type="date" id="input-fecha" class="input-grande">
      
      <label class="etiqueta">Hora:</label>
      <input type="time" id="input-hora" class="input-grande">

      <div class="fila-botones">
        <button class="btn btn-guardar" onclick="guardarFecha()">Guardar</button>
        <button class="btn btn-peligro" onclick="borrarFecha()">Borrar fecha</button>
        <button class="btn btn-cerrar" onclick="cerrarModales()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal para meter el Acta del Partido -->
  <div id="modal-acta" class="modal oculto no-print">
    <div class="modal-contenido">
      <h3>Acta del Partido</h3>
      
      <div class="bloque-jugador-acta">
        <strong id="acta-nom-j1">JUGADOR 1</strong>
        <div class="fila-inputs-acta">
          <div>
            <label class="etiqueta-sub">Carambolas</label>
            <input type="number" id="acta-car-j1" class="input-acta" placeholder="0">
          </div>
          <div>
            <label class="etiqueta-sub">A 3 Bandas</label>
            <input type="number" id="acta-3b-j1" class="input-acta" placeholder="0">
          </div>
        </div>
      </div>

      <div class="bloque-jugador-acta">
        <strong id="acta-nom-j2">JUGADOR 2</strong>
        <div class="fila-inputs-acta">
          <div>
            <label class="etiqueta-sub">Carambolas</label>
            <input type="number" id="acta-car-j2" class="input-acta" placeholder="0">
          </div>
          <div>
            <label class="etiqueta-sub">A 3 Bandas</label>
            <input type="number" id="acta-3b-j2" class="input-acta" placeholder="0">
          </div>
        </div>
      </div>

      <div>
        <label class="etiqueta-sub">Tiempo de juego (minutos)</label>
        <input type="number" id="acta-minutos" class="input-grande" placeholder="Ej: 65">
      </div>

      <div class="fila-botones">
        <button class="btn btn-guardar" onclick="guardarActa()">Guardar Acta</button>
        <button class="btn btn-peligro" onclick="borrarActa()">Borrar Acta</button>
        <button class="btn btn-cerrar" onclick="cerrarModales()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal Exclusivo de Administrador (para cambiar de jornada y partidos) -->
  <div id="modal-admin" class="modal oculto no-print">
    <div class="modal-contenido modal-ancho">
      <h3>Configurar Nueva Jornada</h3>
      
      <div class="campo-admin">
        <label class="etiqueta">Número de Jornada:</label>
        <input type="text" id="admin-num-jornada" class="input-grande" placeholder="Ej: JORNADA 9">
      </div>

      <div class="campo-admin">
        <label class="etiqueta">Rango de fechas:</label>
        <input type="text" id="admin-fechas" class="input-grande" placeholder="Ej: (14/11 al 21/11 de 2026)">
      </div>

      <h4>Emparejamientos (6 partidos)</h4>
      <div id="admin-contenedor-partidos"></div>

      <div class="fila-botones">
        <button class="btn btn-guardar" onclick="guardarNuevaJornadaAdmin()">Activar esta Jornada</button>
        <button class="btn btn-cerrar" onclick="cerrarModales()">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Scripts Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="app.js"></script>
</body>
</html>
